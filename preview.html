<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devicely — Preview Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --indigo:   #6366f1;
      --purple:   #8b5cf6;
      --pink:     #ec4899;
      --cyan:     #22d3ee;
      --slate-50:  #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white:    #ffffff;

      --toolbar-h: 64px;
      --statusbar-h: 40px;
      --bg: #f0f2f8;
      --surface: #ffffff;
      --border: var(--slate-200);
      --accent: var(--indigo);
      --accent2: var(--purple);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 16px rgba(99,102,241,.10), 0 2px 6px rgba(0,0,0,.06);
      --shadow-lg: 0 20px 60px rgba(99,102,241,.12), 0 8px 24px rgba(0,0,0,.08);
      --shadow-device: 0 32px 80px rgba(15,23,42,.18), 0 8px 24px rgba(99,102,241,.10);

      --transition: all .35s cubic-bezier(.4,0,.2,1);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--slate-800);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ─── TOOLBAR ──────────────────────────────── */
    .toolbar {
      height: var(--toolbar-h);
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
      flex-shrink: 0;
      position: relative;
    }

    /* left */
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--slate-600);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      white-space: nowrap;
    }
    .back-btn:hover {
      background: var(--indigo);
      border-color: var(--indigo);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99,102,241,.35);
      transform: translateX(-2px);
    }
    .back-btn svg { flex-shrink: 0; }

    .url-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--slate-100);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      max-width: 340px;
      overflow: hidden;
    }
    .url-pill .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity:1; transform: scale(1); }
      50%      { opacity:.6; transform: scale(.85); }
    }
    .url-pill span {
      font-size: 12px;
      font-weight: 500;
      color: var(--slate-600);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* center */
    .toolbar-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar-logo {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(99,102,241,.4);
    }
    .toolbar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--slate-800);
      letter-spacing: -.3px;
    }
    .toolbar-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--indigo);
      background: rgba(99,102,241,.1);
      border: 1px solid rgba(99,102,241,.2);
      border-radius: 999px;
      padding: 2px 8px;
      letter-spacing: .3px;
    }

    /* right */
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: flex-end;
    }

    .device-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--slate-500);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }
    .device-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      opacity: 0;
      transition: opacity .3s;
      z-index: 0;
    }
    .device-btn svg, .device-btn span { position: relative; z-index: 1; }
    .device-btn:hover {
      border-color: var(--indigo);
      color: var(--indigo);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99,102,241,.2);
    }
    .device-btn.active {
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,.4);
    }
    .device-btn.active::after { opacity: 1; }

    .divider {
      width: 1px; height: 28px;
      background: var(--border);
      margin: 0 4px;
    }

    /* ─── STATUS BAR ───────────────────────────── */
    .statusbar {
      height: var(--statusbar-h);
      background: rgba(255,255,255,.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-shrink: 0;
    }
    .status-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--slate-500);
    }
    .status-chip strong {
      color: var(--slate-700);
      font-weight: 700;
    }
    #size-display {
      font-size: 12px;
      font-weight: 700;
      color: var(--indigo);
      font-variant-numeric: tabular-nums;
      min-width: 110px;
      text-align: center;
    }

    /* ─── CANVAS ───────────────────────────────── */
    .canvas {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 36px 24px 40px;
      position: relative;
    }

    /* subtle grid bg */
    .canvas::before {
      content: '';
      position: fixed;
      inset: calc(var(--toolbar-h) + var(--statusbar-h)) 0 0 0;
      background-image:
        linear-gradient(rgba(99,102,241,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── DEVICE SHELL ─────────────────────────── */
    .device-shell-wrap {
      position: relative;
      z-index: 1;
    }

    .device-label {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--slate-400);
      margin-bottom: 14px;
    }

    .device-shell {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-device);
      overflow: hidden;
      transition: width .42s cubic-bezier(.4,0,.2,1),
                  height .42s cubic-bezier(.4,0,.2,1),
                  border-radius .3s ease;
      position: relative;
      border: 1px solid rgba(255,255,255,.7);
    }

    /* chrome bar for laptop / desktop */
    .chrome-bar {
      height: 36px;
      background: linear-gradient(to bottom, #f8fafc, #f1f5f9);
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }
    .chrome-dots { display: flex; gap: 6px; }
    .chrome-dot {
      width: 11px; height: 11px;
      border-radius: 50%;
    }
    .dot-red   { background: #ff5f57; }
    .dot-yellow{ background: #febc2e; }
    .dot-green { background: #28c840; }

    .chrome-url-bar {
      flex: 1;
      height: 22px;
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 10px;
      color: var(--slate-500);
      font-weight: 500;
      overflow: hidden;
      max-width: 400px;
      margin: 0 auto;
    }
    .chrome-lock {
      width: 8px; height: 8px;
      margin-right: 5px;
      flex-shrink: 0;
      color: #22c55e;
    }
    .chrome-url-text {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* mobile notch bar */
    .notch-bar {
      height: 28px;
      background: var(--slate-900);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .notch {
      width: 80px; height: 16px;
      background: var(--slate-900);
      border-radius: 0 0 14px 14px;
      position: relative;
    }
    .notch::before {
      content: '';
      width: 8px; height: 8px;
      background: #1e293b;
      border-radius: 50%;
      position: absolute;
      top: 4px; left: 50%; transform: translateX(-50%);
      box-shadow: 0 0 0 2px #334155;
    }

    /* tablet top bar */
    .tablet-bar {
      height: 22px;
      background: var(--slate-100);
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
      flex-shrink: 0;
      gap: 6px;
    }
    .tablet-cam {
      width: 7px; height: 7px;
      background: var(--slate-300);
      border-radius: 50%;
    }

    .frame-inner {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      flex: 1;
    }

    /* ─── NO URL STATE ─────────────────────────── */
    .no-url {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(135deg, #f8fafc 60%, #eef2ff 100%);
      padding: 40px;
    }
    .no-url-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--slate-100), var(--slate-200));
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md);
    }
    .no-url h2 {
      font-size: 18px; font-weight: 700;
      color: var(--slate-700);
      text-align: center;
    }
    .no-url p {
      font-size: 13px; color: var(--slate-500);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }
    .no-url a {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      color: #fff;
      font-size: 13px; font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(99,102,241,.35);
      transition: var(--transition);
    }
    .no-url a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(99,102,241,.45);
    }

    /* ─── ZOOM ─────────────────────────────────── */
    .zoom-controls {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 200;
    }
    .zoom-btn {
      width: 38px; height: 38px;
      border-radius: var(--radius-sm);
      background: white;
      border: 1.5px solid var(--border);
      color: var(--slate-600);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      font-family: inherit;
    }
    .zoom-btn:hover {
      background: var(--indigo);
      border-color: var(--indigo);
      color: white;
      box-shadow: 0 4px 14px rgba(99,102,241,.4);
      transform: scale(1.08);
    }
    #zoom-label {
      font-size: 10px; font-weight: 700;
      text-align: center; color: var(--slate-500);
      letter-spacing: .3px;
    }

    /* ─── LOADING OVERLAY ──────────────────────── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .loading-overlay.show { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--slate-200);
      border-top-color: var(--indigo);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── SCALE WRAPPER ─────────────────────────── */
    .scale-wrapper {
      transform-origin: top center;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }

    /* ─── TOOLTIP ──────────────────────────────── */
    [data-tip] { position: relative; }
    [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--slate-900);
      color: white;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 999;
    }

    /* ─── ANIM ─────────────────────────────────── */
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    .device-shell-wrap { animation: slide-up .5s cubic-bezier(.4,0,.2,1) both; }

  </style>
</head>
<body>

  <!-- ─── TOOLBAR ─────────────────────────────────────── -->
  <header class="toolbar">
    <div class="toolbar-left">
      <a href="index.html" class="back-btn" id="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </a>
      <div class="url-pill" id="url-pill" style="display:none">
        <span class="dot"></span>
        <span id="url-display">—</span>
      </div>
    </div>

    <div class="toolbar-center">
      <div class="toolbar-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4" width="20" height="14" rx="2" stroke="white" stroke-width="2"/>
          <path d="M8 21h8M12 18v3" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="toolbar-title">Devicely</span>
      <span class="toolbar-badge">Preview Mode</span>
    </div>

    <div class="toolbar-right">
      <button class="device-btn" data-device="mobile" data-tip="375 × 667">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="6" y="2" width="12" height="20" rx="3"/>
          <line x1="10" y1="19" x2="14" y2="19" stroke-linecap="round"/>
        </svg>
        <span>Mobile</span>
      </button>
      <button class="device-btn" data-device="tablet" data-tip="768 × 1024">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <circle cx="12" cy="18" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
        <span>Tablet</span>
      </button>
      <button class="device-btn" data-device="laptop" data-tip="1024 × 768">
        <svg width="15" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M0 21h24"/>
        </svg>
        <span>Laptop</span>
      </button>
      <div class="divider"></div>
      <button class="device-btn active" data-device="desktop" data-tip="1440 × 900">
        <svg width="16" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4" stroke-linecap="round"/>
        </svg>
        <span>Desktop</span>
      </button>
    </div>
  </header>

  <!-- ─── STATUS BAR ─────────────────────────────────── -->
  <div class="statusbar">
    <div class="status-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Device: <strong id="device-name-display">Desktop</strong>
    </div>
    <div class="status-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 3v18M3 9h6M3 15h6"/>
      </svg>
      <span id="size-display">1440 × 900</span>
    </div>
    <div class="status-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      Zoom: <strong id="zoom-pct">100%</strong>
    </div>
    <div class="status-chip" id="status-live" style="display:none">
      <span style="width:7px;height:7px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse-dot 2s ease-in-out infinite"></span>
      Live Preview
    </div>
  </div>

  <!-- ─── CANVAS ─────────────────────────────────────── -->
  <div class="canvas" id="canvas">
    <div class="scale-wrapper" id="scale-wrapper">
      <div class="device-shell-wrap" id="device-shell-wrap">
        <div class="device-label" id="device-label">Desktop · 1440 × 900</div>

        <div class="device-shell" id="device-shell" style="width:1440px;height:900px">
          <!-- chrome bar injected by JS -->
          <div class="frame-inner" id="frame-inner">
            <div class="loading-overlay" id="loading-overlay">
              <div class="spinner"></div>
            </div>
            <!-- iframe or no-url message will be placed here -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ─── ZOOM CONTROLS ──────────────────────────────── -->
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
    <span id="zoom-label">Zoom</span>
    <button class="zoom-btn" id="zoom-out" title="Zoom out">−</button>
    <button class="zoom-btn" id="zoom-reset" title="Reset zoom" style="font-size:12px;font-weight:700;">1:1</button>
  </div>

  <script>
    /* ────────────────────────────────────────────────────
       DATA
    ──────────────────────────────────────────────────── */
    const DEVICES = {
      mobile:  { w: 375,  h: 667,  label: 'Mobile',  chrome: 'mobile'  },
      tablet:  { w: 768,  h: 1024, label: 'Tablet',  chrome: 'tablet'  },
      laptop:  { w: 1024, h: 768,  label: 'Laptop',  chrome: 'desktop' },
      desktop: { w: 1440, h: 900,  label: 'Desktop', chrome: 'desktop' },
    };

    let currentDevice = 'desktop';
    let currentZoom = 1.0;
    let previewURL = '';

    /* ────────────────────────────────────────────────────
       DOM REFS
    ──────────────────────────────────────────────────── */
    const shell         = document.getElementById('device-shell');
    const frameInner    = document.getElementById('frame-inner');
    const deviceLabel   = document.getElementById('device-label');
    const sizeDisplay   = document.getElementById('size-display');
    const deviceNameDsp = document.getElementById('device-name-display');
    const scaleWrapper  = document.getElementById('scale-wrapper');
    const urlPill       = document.getElementById('url-pill');
    const urlDisplay    = document.getElementById('url-display');
    const loadingOverlay= document.getElementById('loading-overlay');
    const zoomPct       = document.getElementById('zoom-pct');
    const statusLive    = document.getElementById('status-live');

    /* ────────────────────────────────────────────────────
       CHROME BAR BUILDERS
    ──────────────────────────────────────────────────── */
    function desktopChrome(url) {
      const bar = document.createElement('div');
      bar.className = 'chrome-bar';
      bar.innerHTML = `
        <div class="chrome-dots">
          <div class="chrome-dot dot-red"></div>
          <div class="chrome-dot dot-yellow"></div>
          <div class="chrome-dot dot-green"></div>
        </div>
        <div class="chrome-url-bar">
          <svg class="chrome-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <span class="chrome-url-text">${url || 'about:blank'}</span>
        </div>`;
      return bar;
    }

    function mobileChrome() {
      const bar = document.createElement('div');
      bar.className = 'notch-bar';
      bar.innerHTML = `<div class="notch"></div>`;
      return bar;
    }

    function tabletChrome() {
      const bar = document.createElement('div');
      bar.className = 'tablet-bar';
      bar.innerHTML = `<div class="tablet-cam"></div>`;
      return bar;
    }

    /* ────────────────────────────────────────────────────
       RENDER DEVICE
    ──────────────────────────────────────────────────── */
    function renderDevice(deviceKey) {
      const d = DEVICES[deviceKey];
      currentDevice = deviceKey;

      // update shell size
      shell.style.width  = d.w + 'px';
      shell.style.height = d.h + 'px';

      // border-radius: rounder for mobile
      shell.style.borderRadius = deviceKey === 'mobile' ? '32px' :
                                  deviceKey === 'tablet' ? '22px' : '14px';

      // label
      deviceLabel.textContent = `${d.label} · ${d.w} × ${d.h}`;
      sizeDisplay.textContent = `${d.w} × ${d.h}`;
      deviceNameDsp.textContent = d.label;

      // rebuild frame inner
      frameInner.innerHTML = '';

      // chrome
      const chromeEl = d.chrome === 'mobile' ? mobileChrome()
                      : d.chrome === 'tablet' ? tabletChrome()
                      : desktopChrome(previewURL);
      frameInner.appendChild(chromeEl);

      // loading
      frameInner.appendChild(loadingOverlay);

      // content
      if (previewURL) {
        showLoading(true);
        const iframe = document.createElement('iframe');
        iframe.className = 'preview-iframe';
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox');
        iframe.setAttribute('loading', 'lazy');
        iframe.src = previewURL;
        iframe.onload = () => { showLoading(false); };
        iframe.onerror = () => { showLoading(false); };
        frameInner.appendChild(iframe);
        statusLive.style.display = 'flex';
      } else {
        const noURL = document.createElement('div');
        noURL.className = 'no-url';
        noURL.innerHTML = `
          <div class="no-url-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </div>
          <h2>No website to preview</h2>
          <p>Please go back and enter a URL to start previewing your site.</p>
          <a href="index.html">← Go Back Home</a>`;
        frameInner.appendChild(noURL);
      }

      // auto-zoom to fit canvas
      applyAutoZoom();
    }

    /* ────────────────────────────────────────────────────
       ZOOM
    ──────────────────────────────────────────────────── */
    function applyZoom(z) {
      currentZoom = Math.min(2, Math.max(0.1, z));
      scaleWrapper.style.transform = `scale(${currentZoom})`;
      zoomPct.textContent = Math.round(currentZoom * 100) + '%';
      document.getElementById('zoom-label').textContent = Math.round(currentZoom * 100) + '%';
    }

    function applyAutoZoom() {
      const canvas = document.getElementById('canvas');
      const d = DEVICES[currentDevice];
      const padW = 80, padH = 120;
      const availW = canvas.clientWidth - padW;
      const availH = canvas.clientHeight - padH;
      const zW = availW / d.w;
      const zH = availH / d.h;
      const z  = Math.min(zW, zH, 1.0);
      applyZoom(parseFloat(z.toFixed(2)));
    }

    document.getElementById('zoom-in').addEventListener('click',    () => applyZoom(currentZoom + 0.1));
    document.getElementById('zoom-out').addEventListener('click',   () => applyZoom(currentZoom - 0.1));
    document.getElementById('zoom-reset').addEventListener('click', () => applyAutoZoom());

    /* ────────────────────────────────────────────────────
       LOADING
    ──────────────────────────────────────────────────── */
    function showLoading(show) {
      if (show) loadingOverlay.classList.add('show');
      else      loadingOverlay.classList.remove('show');
    }

    /* ────────────────────────────────────────────────────
       DEVICE BUTTONS
    ──────────────────────────────────────────────────── */
    document.querySelectorAll('.device-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDevice(btn.dataset.device);
      });
    });

    /* ────────────────────────────────────────────────────
       BACK BUTTON HREF
    ──────────────────────────────────────────────────── */
    // allow plain home.html or index.html
    document.getElementById('back-btn').setAttribute('href', 'index.html');

    /* ────────────────────────────────────────────────────
       INIT
    ──────────────────────────────────────────────────── */
    function init() {
      previewURL = localStorage.getItem('previewURL') || '';

      if (previewURL) {
        urlPill.style.display = 'flex';
        urlDisplay.textContent = previewURL.replace(/^https?:\/\//, '');
      }

      renderDevice('desktop');
    }

    init();

    /* ────────────────────────────────────────────────────
       RESIZE — RE-AUTO-ZOOM
    ──────────────────────────────────────────────────── */
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => applyAutoZoom(), 120);
    });

    /* ────────────────────────────────────────────────────
       KEYBOARD SHORTCUTS
    ──────────────────────────────────────────────────── */
    window.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey) {
        if (e.key === '=' || e.key === '+') { e.preventDefault(); applyZoom(currentZoom + 0.1); }
        if (e.key === '-')                  { e.preventDefault(); applyZoom(currentZoom - 0.1); }
        if (e.key === '0')                  { e.preventDefault(); applyAutoZoom(); }
      }
      // 1-4 to switch devices
      const map = { '1':'mobile', '2':'tablet', '3':'laptop', '4':'desktop' };
      if (map[e.key] && !e.ctrlKey && !e.metaKey) {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-device="${map[e.key]}"]`).classList.add('active');
        renderDevice(map[e.key]);
      }
    });
  </script>
</body>
</html>
