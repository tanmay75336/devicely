<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devicely — Preview Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ─── TOOLBAR ─────────────────────────────────────── -->
  <header class="toolbar">
    <div class="toolbar-left">
      <a href="home.html" class="back-btn" id="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </a>
      <div class="url-pill" id="url-pill" style="display:none">
        <span class="dot"></span>
        <span id="url-display">—</span>
      </div>
    </div>

    <div class="toolbar-center">
      <div class="toolbar-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4" width="20" height="14" rx="2" stroke="white" stroke-width="2"/>
          <path d="M8 21h8M12 18v3" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="toolbar-title">Devicely</span>
      <span class="toolbar-badge">Preview Mode</span>
    </div>

    <div class="toolbar-right">
      <button class="device-btn" data-device="mobile" data-tip="375 × 667">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="6" y="2" width="12" height="20" rx="3"/>
          <line x1="10" y1="19" x2="14" y2="19" stroke-linecap="round"/>
        </svg>
        <span>Mobile</span>
      </button>
      <button class="device-btn" data-device="tablet" data-tip="768 × 1024">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <circle cx="12" cy="18" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
        <span>Tablet</span>
      </button>
      <button class="device-btn" data-device="laptop" data-tip="1024 × 768">
        <svg width="15" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M0 21h24"/>
        </svg>
        <span>Laptop</span>
      </button>
      <div class="divider"></div>
      <button class="device-btn active" data-device="desktop" data-tip="1440 × 900">
        <svg width="16" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4" stroke-linecap="round"/>
        </svg>
        <span>Desktop</span>
      </button>
    </div>
  </header>

  <!-- ─── STATUS BAR ─────────────────────────────────── -->
  <div class="statusbar">
    <div class="status-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Device: <strong id="device-name-display">Desktop</strong>
    </div>
    <div class="status-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 3v18M3 9h6M3 15h6"/>
      </svg>
      <span id="size-display">1440 × 900</span>
    </div>
    <div class="status-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      Zoom: <strong id="zoom-pct">100%</strong>
    </div>
    <div class="status-chip" id="status-live" style="display:none">
      <span style="width:7px;height:7px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse-dot 2s ease-in-out infinite"></span>
      Live Preview
    </div>
  </div>

  <!-- ─── CANVAS ─────────────────────────────────────── -->
  <div class="canvas" id="canvas">
    <div class="scale-wrapper" id="scale-wrapper">
      <div class="device-shell-wrap" id="device-shell-wrap">
        <div class="device-label" id="device-label">Desktop · 1440 × 900</div>

        <div class="device-shell" id="device-shell" style="width:1440px;height:900px">
          <!-- chrome bar injected by JS -->
          <div class="frame-inner" id="frame-inner">
            <div class="loading-overlay" id="loading-overlay">
              <div class="spinner"></div>
            </div>
            <!-- iframe or no-url message will be placed here -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ─── ZOOM CONTROLS ──────────────────────────────── -->
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
    <span id="zoom-label">Zoom</span>
    <button class="zoom-btn" id="zoom-out" title="Zoom out">−</button>
    <button class="zoom-btn" id="zoom-reset" title="Reset zoom" style="font-size:12px;font-weight:700;">1:1</button>
  </div>

  <script>
    /* ────────────────────────────────────────────────────
       DATA
    ──────────────────────────────────────────────────── */
    const DEVICES = {
      mobile:  { w: 375,  h: 667,  label: 'Mobile',  chrome: 'mobile'  },
      tablet:  { w: 768,  h: 1024, label: 'Tablet',  chrome: 'tablet'  },
      laptop:  { w: 1024, h: 768,  label: 'Laptop',  chrome: 'desktop' },
      desktop: { w: 1440, h: 900,  label: 'Desktop', chrome: 'desktop' },
    };

    let currentDevice = 'desktop';
    let currentZoom = 1.0;
    let previewURL = '';

    /* ────────────────────────────────────────────────────
       DOM REFS
    ──────────────────────────────────────────────────── */
    const shell         = document.getElementById('device-shell');
    const frameInner    = document.getElementById('frame-inner');
    const deviceLabel   = document.getElementById('device-label');
    const sizeDisplay   = document.getElementById('size-display');
    const deviceNameDsp = document.getElementById('device-name-display');
    const scaleWrapper  = document.getElementById('scale-wrapper');
    const urlPill       = document.getElementById('url-pill');
    const urlDisplay    = document.getElementById('url-display');
    const loadingOverlay= document.getElementById('loading-overlay');
    const zoomPct       = document.getElementById('zoom-pct');
    const statusLive    = document.getElementById('status-live');

    /* ────────────────────────────────────────────────────
       CHROME BAR BUILDERS
    ──────────────────────────────────────────────────── */
    function desktopChrome(url) {
      const bar = document.createElement('div');
      bar.className = 'chrome-bar';
      bar.innerHTML = `
        <div class="chrome-dots">
          <div class="chrome-dot dot-red"></div>
          <div class="chrome-dot dot-yellow"></div>
          <div class="chrome-dot dot-green"></div>
        </div>
        <div class="chrome-url-bar">
          <svg class="chrome-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <span class="chrome-url-text">${url || 'about:blank'}</span>
        </div>`;
      return bar;
    }

    function mobileChrome() {
      const bar = document.createElement('div');
      bar.className = 'notch-bar';
      bar.innerHTML = `<div class="notch"></div>`;
      return bar;
    }

    function tabletChrome() {
      const bar = document.createElement('div');
      bar.className = 'tablet-bar';
      bar.innerHTML = `<div class="tablet-cam"></div>`;
      return bar;
    }

    /* ────────────────────────────────────────────────────
       RENDER DEVICE
    ──────────────────────────────────────────────────── */
    function renderDevice(deviceKey) {
      const d = DEVICES[deviceKey];
      currentDevice = deviceKey;

      // update shell size
      shell.style.width  = d.w + 'px';
      shell.style.height = d.h + 'px';

      // border-radius: rounder for mobile
      shell.style.borderRadius = deviceKey === 'mobile' ? '32px' :
                                  deviceKey === 'tablet' ? '22px' : '14px';

      // label
      deviceLabel.textContent = `${d.label} · ${d.w} × ${d.h}`;
      sizeDisplay.textContent = `${d.w} × ${d.h}`;
      deviceNameDsp.textContent = d.label;

      // rebuild frame inner
      frameInner.innerHTML = '';

      // chrome
      const chromeEl = d.chrome === 'mobile' ? mobileChrome()
                      : d.chrome === 'tablet' ? tabletChrome()
                      : desktopChrome(previewURL);
      frameInner.appendChild(chromeEl);

      // loading
      frameInner.appendChild(loadingOverlay);

      // content
      if (previewURL) {
        showLoading(true);
        const iframe = document.createElement('iframe');
        iframe.className = 'preview-iframe';
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox');
        iframe.setAttribute('loading', 'lazy');
        iframe.src = previewURL;
        iframe.onload = () => { showLoading(false); };
        iframe.onerror = () => { showLoading(false); };
        frameInner.appendChild(iframe);
        statusLive.style.display = 'flex';
      } else {
        const noURL = document.createElement('div');
        noURL.className = 'no-url';
        noURL.innerHTML = `
          <div class="no-url-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </div>
          <h2>No website to preview</h2>
          <p>Please go back and enter a URL to start previewing your site.</p>
          <a href="home.html">← Go Back Home</a>`;
        frameInner.appendChild(noURL);
      }

      // auto-zoom to fit canvas
      applyAutoZoom();
    }

    /* ────────────────────────────────────────────────────
       ZOOM
    ──────────────────────────────────────────────────── */
    function applyZoom(z) {
      currentZoom = Math.min(2, Math.max(0.1, z));
      scaleWrapper.style.transform = `scale(${currentZoom})`;
      zoomPct.textContent = Math.round(currentZoom * 100) + '%';
      document.getElementById('zoom-label').textContent = Math.round(currentZoom * 100) + '%';
    }

    function applyAutoZoom() {
      const canvas = document.getElementById('canvas');
      const d = DEVICES[currentDevice];
      const padW = 80, padH = 120;
      const availW = canvas.clientWidth - padW;
      const availH = canvas.clientHeight - padH;
      const zW = availW / d.w;
      const zH = availH / d.h;
      const z  = Math.min(zW, zH, 1.0);
      applyZoom(parseFloat(z.toFixed(2)));
    }

    document.getElementById('zoom-in').addEventListener('click',    () => applyZoom(currentZoom + 0.1));
    document.getElementById('zoom-out').addEventListener('click',   () => applyZoom(currentZoom - 0.1));
    document.getElementById('zoom-reset').addEventListener('click', () => applyAutoZoom());

    /* ────────────────────────────────────────────────────
       LOADING
    ──────────────────────────────────────────────────── */
    function showLoading(show) {
      if (show) loadingOverlay.classList.add('show');
      else      loadingOverlay.classList.remove('show');
    }

    /* ────────────────────────────────────────────────────
       DEVICE BUTTONS
    ──────────────────────────────────────────────────── */
    document.querySelectorAll('.device-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDevice(btn.dataset.device);
      });
    });

    /* ────────────────────────────────────────────────────
       BACK BUTTON HREF
    ──────────────────────────────────────────────────── */
    // allow plain home.html or index.html
    document.getElementById('back-btn').setAttribute('href', 'home.html');

    /* ────────────────────────────────────────────────────
       INIT
    ──────────────────────────────────────────────────── */
    function init() {
      previewURL = localStorage.getItem('previewURL') || '';

      if (previewURL) {
        urlPill.style.display = 'flex';
        urlDisplay.textContent = previewURL.replace(/^https?:\/\//, '');
      }

      renderDevice('desktop');
    }

    init();

    /* ────────────────────────────────────────────────────
       RESIZE — RE-AUTO-ZOOM
    ──────────────────────────────────────────────────── */
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => applyAutoZoom(), 120);
    });

    /* ────────────────────────────────────────────────────
       KEYBOARD SHORTCUTS
    ──────────────────────────────────────────────────── */
    window.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey) {
        if (e.key === '=' || e.key === '+') { e.preventDefault(); applyZoom(currentZoom + 0.1); }
        if (e.key === '-')                  { e.preventDefault(); applyZoom(currentZoom - 0.1); }
        if (e.key === '0')                  { e.preventDefault(); applyAutoZoom(); }
      }
      // 1-4 to switch devices
      const map = { '1':'mobile', '2':'tablet', '3':'laptop', '4':'desktop' };
      if (map[e.key] && !e.ctrlKey && !e.metaKey) {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-device="${map[e.key]}"]`).classList.add('active');
        renderDevice(map[e.key]);
      }
    });
  </script>
</body>
</htmlD
