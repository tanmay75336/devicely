<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Devicely</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/supabase.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-full flex items-center justify-center p-4 py-10">

  <!-- Background -->
  <div class="bg-scene">
    <div class="bg-dots"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="signup-card">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-7">
      <div class="logo-icon mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4" width="20" height="14" rx="2" stroke="white" stroke-width="2"/>
          <path d="M8 21h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 18v3" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <rect x="6" y="7" width="5" height="8" rx="1" fill="white" opacity="0.55"/>
          <rect x="13" y="7" width="5" height="8" rx="1" fill="white" opacity="0.3"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create your account</h1>
      <p class="text-sm text-slate-500 mt-1.5">
        Start previewing with <span class="font-semibold text-indigo-600">Devicely</span> — free forever
      </p>

      <!-- Benefit pills -->
      <div class="flex flex-wrap justify-center gap-2 mt-3">
        <span class="benefit-pill">No credit card</span>
        <span class="benefit-pill">Instant access</span>
        <span class="benefit-pill">All devices</span>
      </div>
    </div>

    <!-- Success Box -->
    <div id="success-box" class="success-box mb-5" role="status">
      <span id="success-text">Account created! Check your email to confirm your account.</span>
    </div>

    <!-- Error Box -->
    <div id="error-box" class="error-box mb-5" role="alert">
      <span id="error-text">Something went wrong. Please try again.</span>
    </div>

    <!-- Form -->
    <form id="signup-form" novalidate>
      <div class="space-y-4">

        <div>
          <label for="fullname" class="field-label">Full name</label>
          <input id="fullname" type="text" class="field-input" required>
        </div>

        <div>
          <label for="email" class="field-label">Email address</label>
          <input id="email" type="email" class="field-input" required>
        </div>

        <div>
          <label for="password" class="field-label">Password</label>
          <input id="password" type="password" class="field-input" required>
        </div>

        <div>
          <label for="confirm-password" class="field-label">Confirm password</label>
          <input id="confirm-password" type="password" class="field-input" required>
        </div>

        <div class="terms-check pt-1">
          <input type="checkbox" id="terms" required>
          <label for="terms" class="text-sm text-slate-600">
            I agree to the Terms of Service and Privacy Policy
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary mt-1 w-full">
          <span id="btn-content">Create Account →</span>
        </button>

      </div>
    </form>

    <!-- Divider (Improved Alignment Properly) -->
    <div class="my-6 flex items-center text-slate-400 text-sm">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="px-4 whitespace-nowrap">or sign up with</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <!-- Google SSO placeholder -->
    <button type="button"
      class="btn-social w-full flex items-center justify-center gap-2"
      onclick="alert('Google OAuth — connect Supabase provider to enable.')">
      Continue with Google
    </button>

    <p class="text-center text-sm text-slate-500 mt-7">
      Already have an account?
      <a href="login.html" class="font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
        Sign in
      </a>
    </p>

  </div>

  <script>
    const supabase = window.supabaseClient;

    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnContent = document.getElementById('btn-content');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const successBox = document.getElementById('success-box');
    const successText = document.getElementById('success-text');

    function showError(msg) {
      successBox.classList.remove('visible');
      errorText.textContent = msg;
      errorBox.classList.add('visible');
    }

    function showSuccess(msg) {
      errorBox.classList.remove('visible');
      successText.textContent = msg;
      successBox.classList.add('visible');
    }

    function hideMessages() {
      errorBox.classList.remove('visible');
      successBox.classList.remove('visible');
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnContent.textContent = loading ? "Creating account…" : "Create Account →";
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const terms = document.getElementById('terms').checked;

      if (!fullname) return showError('Please enter your full name.');
      if (!email) return showError('Please enter a valid email.');
      if (password.length < 8) return showError('Password must be at least 8 characters.');
      if (password !== confirm) return showError('Passwords do not match.');
      if (!terms) return showError('Please agree to the Terms.');

      setLoading(true);

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullname } }
      });

      if (error) {
        showError(error.message);
        setLoading(false);
        return;
      }

      if (data?.session) {
        window.location.href = 'dashboard.html';
      } else {
        showSuccess('Account created! Check your email to confirm.');
        setLoading(false);
      }
    });
  </script>

</body>
</html>
